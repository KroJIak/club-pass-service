services:
  db:
    image: postgres:15-alpine
    container_name: club-pass-db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-club_pass}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  db-init:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: club-pass-db-init
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-club_pass}
    depends_on:
      db:
        condition: service_healthy
    command: python -m api.scripts.init_db
    restart: "no"

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: club-pass-api
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-club_pass}
      EXPIRATION_SERVICE_URL: ${EXPIRATION_SERVICE_URL:-http://expiration-service:8001}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      BOT_API_URL: ${BOT_API_URL:-http://bot:8002}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    volumes:
      - ./api:/app/api
      - ./uploads:/app/uploads
      - ./alembic.ini:/app/alembic.ini
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload

  bot:
    build:
      context: .
      dockerfile: docker/Dockerfile.bot
    container_name: club-pass-bot
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      API_URL: http://api:8000
      API_PREFIX: /api
      I18N_SUPPORTED_LOCALES: ${I18N_SUPPORTED_LOCALES:-ru_ru,en_us}
      I18N_DEFAULT_LOCALE: ${I18N_DEFAULT_LOCALE:-ru_ru}
    ports:
      - "${BOT_API_PORT:-8002}:8002"
    depends_on:
      - api
    volumes:
      - ./bot:/app/bot
      - ./uploads:/app/uploads
    restart: unless-stopped

  admin:
    build:
      context: .
      dockerfile: docker/Dockerfile.admin
      args:
        VITE_API_URL: ""  # Use relative paths with nginx proxy
    container_name: club-pass-admin
    ports:
      - "${ADMIN_PORT:-3000}:80"
    depends_on:
      - api
    restart: unless-stopped

  staff-bot:
    build:
      context: .
      dockerfile: docker/Dockerfile.staff-bot
    container_name: club-pass-staff-bot
    environment:
      STAFF_BOT_TOKEN: ${STAFF_BOT_TOKEN}
      API_URL: http://api:8000
      API_PREFIX: /api
      MINI_APP_URL: ${MINI_APP_URL:-http://localhost:3001}
    depends_on:
      - api
    volumes:
      - ./staff-bot:/app/staff-bot
    working_dir: /app/staff-bot
    restart: unless-stopped

  mini-app:
    build:
      context: .
      dockerfile: docker/Dockerfile.mini-app
      args:
        VITE_API_URL: ""  # Use relative paths with nginx proxy
    container_name: club-pass-mini-app
    ports:
      - "${MINI_APP_PORT:-3001}:80"
    depends_on:
      - api
    restart: unless-stopped

  expiration-service:
    build:
      context: .
      dockerfile: expiration-service/Dockerfile
    container_name: club-pass-expiration
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-club_pass}
      CHECK_INTERVAL_MINUTES: ${EXPIRATION_CHECK_INTERVAL:-30}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      API_PORT: ${EXPIRATION_API_PORT:-8001}
    ports:
      - "${EXPIRATION_API_PORT:-8001}:${EXPIRATION_API_PORT:-8001}"
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    restart: unless-stopped

  music-search:
    build:
      context: .
      dockerfile: music-search-service/Dockerfile
    container_name: club-pass-music-search
    environment:
      YANDEX_MUSIC_TOKEN: ${YANDEX_MUSIC_TOKEN}
      MUSIC_API_BASE_URL: ${MUSIC_API_BASE_URL:-https://bhindi1.ddns.net/music/api}
    ports:
      - "8004:8004"
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 1.1.1.1
    restart: unless-stopped

  cloudpub-init:
    image: alpine:latest
    container_name: club-pass-cloudpub-init
    volumes:
      - ./cloudpub-config:/cloudpub-config
    command: sh -c "mkdir -p /cloudpub-config/cloudpub-admin-panel /cloudpub-config/cloudpub-mini-app && chmod -R 777 /cloudpub-config"
    restart: "no"

  cloudpub-admin-panel:
    image: cloudpub/cloudpub:latest-arm64
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    environment:
      - TOKEN=${CLOUDPUB_TOKEN}
      - HTTP=localhost:${ADMIN_PORT:-3000}
    command: run
    depends_on:
      admin:
        condition: service_started
      cloudpub-init:
        condition: service_completed_successfully
    volumes:
      - ./cloudpub-config/cloudpub-admin-panel:/home/cloudpub

  cloudpub-mini-app:
    image: cloudpub/cloudpub:latest-arm64
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    environment:
      - TOKEN=${CLOUDPUB_TOKEN}
      - HTTP=localhost:${MINI_APP_PORT:-3001}
    command: run
    depends_on:
      mini-app:
        condition: service_started
      cloudpub-init:
        condition: service_completed_successfully
    volumes:
      - ./cloudpub-config/cloudpub-mini-app:/home/cloudpub

volumes:
  postgres_data:

